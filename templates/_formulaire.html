{% if form.non_field_errors %}
  <div class="alert alert-danger">{{ form.non_field_errors }}</div>
{% endif %}
{% for champ in form %}
  <div class="mb-3">
    <label for="{{ champ.id_for_label }}" class="form-label">{{ champ.label }}</label>
    {{ champ }}
    {% if champ.help_text %}<div class="form-text">{{ champ.help_text }}</div>{% endif %}
    {% for erreur in champ.errors %}<div class="text-danger small">{{ erreur }}</div>{% endfor %}
  </div>
{% endfor %}
