{% if page.paginator.num_pages > 1 %}
<nav aria-label="Pagination">
  <ul class="pagination justify-content-center">
    {% if page.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}">Précédent</a></li>
    {% else %}
      <li class="page-item disabled"><span class="page-link">Précédent</span></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page.number }} sur {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Suivant</a></li>
    {% else %}
      <li class="page-item disabled"><span class="page-link">Suivant</span></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
