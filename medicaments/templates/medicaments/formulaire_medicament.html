{% extends "base.html" %}
{% block titre %}{{ titre }} — PharmaGest{% endblock %}
{% block contenu %}
<h1 class="h3 mb-3">{{ titre }}</h1>
<form method="post" enctype="multipart/form-data" class="card card-body">
  {% csrf_token %}
  {% include "_formulaire.html" %}
  <div>
    <button type="submit" class="btn btn-success">Enregistrer</button>
    <a href="{% if medicament %}{% url 'medicaments:detail' medicament.pk %}{% else %}{% url 'medicaments:liste' %}{% endif %}" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
{% endblock %}
