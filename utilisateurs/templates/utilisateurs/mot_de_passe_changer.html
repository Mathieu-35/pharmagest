{% extends "base.html" %}
{% block titre %}Changer le mot de passe — PharmaGest{% endblock %}
{% block contenu %}
<h1 class="h3 mb-3">Changer mon mot de passe</h1>
<form method="post" class="card card-body" style="max-width:480px">
  {% csrf_token %}
  {% include "_formulaire.html" %}
  <div>
    <button type="submit" class="btn btn-success">Enregistrer</button>
    <a href="{% url 'accueil' %}" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
{% endblock %}
